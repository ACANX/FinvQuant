# FinvQuant — 外部 OpenAPI：分钟行情批量 Upsert（OpenAPI 3.1 契约）
#
# 与同目录 Upsert.md 成对维护：
#   - .md 正文是人类可读说明；
#   - 本文件是机器可读契约。
# 请求体 schema 通过相对 $ref 复用内部 KLineUpsert.yml，避免重复定义。
#
openapi: 3.1.0
info:
  title: FinvQuant — 外部 OpenAPI：分钟行情批量 Upsert
  version: 1.0.0
  description: |
    外部 HOOK / 采集端批量写入分钟行情 K 线（主键 usc + ts）。
    业务逻辑复用内部 KLine.Upsert handler；认证使用静态密钥
    （FINV_OPENAPI_KEY，过渡方案），成功响应统一为 {code, data, message}。
servers:
  - url: http://127.0.0.1:16001
    description: 本机直连（生产经 Nginx 反代时替换为 https://<域名>）
tags:
  - name: OpenAPI/Cdeu/Min
    description: 外部 OpenAPI（分钟行情）
security:
  - bearerAuth: []
  - apiKeyHeader: []
paths:
  /OpenAPI/V1/Meta/Finv/Quote/Cdeu/Min/Upsert:
    post:
      operationId: externalUpsertCdeuKLineMin
      tags: [OpenAPI/Cdeu/Min]
      summary: 外部批量写入分钟行情 K 线（upsert）
      description: |
        请求体/校验/错误码与内部 /API/V1/Meta/Finv/Quote/Cdeu/Min/Upsert 完全一致。
        onConflict=skip 已存在键跳过；onConflict=update（默认）整行覆盖。
      parameters:
        - name: onConflict
          in: query
          required: false
          description: 冲突处理模式；兼容旧名 `on_conflict`。
          schema:
            type: string
            enum: [skip, update]
            default: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    $ref: '../../../API/Quote/Cdeu/Min/KLineUpsert.yml#/components/schemas/KLineItem'
            examples:
              oneItem:
                summary: 单条写入
                value:
                  items:
                    - usc: GCMain
                      ts: 1700000000
                      date: 20231114
                      time: 93000
                      open: 3.51
                      high: 3.62
                      low: 3.50
                      close: 3.60
                      volume: 1000
                      turnover: 3560.00
                      provider: FT
      responses:
        '200':
          description: 写入成功（统一信封）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAPIResponse'
              examples:
                update:
                  value:
                    code: 0
                    data: { affected: 1, mode: update }
                    message: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <FINV_OPENAPI_KEY>`（静态密钥，与登录会话令牌不通用）。
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: 直接传 `<FINV_OPENAPI_KEY>`；与 bearerAuth 二选一。
  schemas:
    OpenAPIResponse:
      type: object
      required: [code, data, message]
      additionalProperties: false
      properties:
        code:
          type: integer
          enum: [0, 1, 200, 202]
          default: 0
          description: |
            成功码，默认输出 0；1 / 200 / 202 同样视为正常响应（兼容）。
        data:
          $ref: '#/components/schemas/UpsertData'
        message:
          type: string
          const: OK
    UpsertData:
      type: object
      required: [affected, mode]
      additionalProperties: false
      properties:
        affected:
          type: integer
          format: int64
          minimum: 0
          description: skip 为实际插入行数；update 为插入 + 覆盖影响行数。
        mode:
          type: string
          enum: [skip, update]
          description: 本次实际使用的冲突处理模式。
    ErrorResponse:
      type: object
      required: [code, message, detail, request_id, error]
      additionalProperties: false
      properties:
        code:
          type: integer
        message:
          type: string
        detail:
          type: string
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/ErrorObject'
        debug:
          type: object
          additionalProperties: { type: string }
    ErrorObject:
      type: object
      required: [code, catalog_version, retryable]
      additionalProperties: false
      properties:
        code:
          type: integer
        catalog_version:
          type: string
        retryable:
          type: boolean
  responses:
    BadRequest:
      description: 缺少必填参数 / 请求体格式错误 / 枚举非法（211001、211002、211006）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未携带 FINV_OPENAPI_KEY 或密钥错误
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: integer, const: 401 }
              message: { type: string }
    Conflict:
      description: 请求内重复主键（211102）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: items 超过上限（211201）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 字段类型/范围/未知字段/数据库约束（211003、211004、211005、211303）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误（211301，可重试）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 数据服务不可用（211302，可重试）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
