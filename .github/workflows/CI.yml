# FinvQuant CI/CD：构建并推送 All-in-One 镜像到 GitHub Packages (GHCR)
#   - ghcr.io/acanx/finvquant（Go 服务端 16001 + 内嵌前端 16002，单镜像单进程）
#
# 触发：push 到 dev/main/FinvQuant/feat/integration、tag v*、PR、手动
# 全局版本：单一来源 = 项目根 VERSION 文件（同时用于后端 -ldflags、前端 package.json、镜像 tag）
# tag 规则：
#   - dev/main/FinvQuant 分支推送：latest + v{VERSION}-YYYYMMDDHHMM（Asia/Shanghai，如 v0.1.0-202608051901）
#   - v* tag 推送（main 发布）：latest + v{VERSION}（即 git tag 名，如 v0.1.0）
#   - feat/integration 分支推送（融合集成分支）：**不走上面的镜像规则**，改为快照模式
#       版本：v{VERSION}.{PPPPP}.{yymmddHHmm}
#         PPPPP  = 关联 PR 编号（5 位左补零；无 PR 时为 00000）
#         yymmddHHmm = 构建时间戳（Asia/Shanghai），同一快照的所有产物共用同一个值
#       产物：Ubuntu 26.04 可执行包（tar.gz, linux/amd64 + linux/arm64）
#             Windows 11 可执行包（zip, windows/amd64）
#       发布：以快照版本为 git tag 建 prerelease，附两个包与 SHA256SUMS
#       镜像：feat/integration 不构建镜像（保持既有镜像模式不被集成分支污染）
#   - 多平台构建策略（构建速度优化）：
#     - dev/FinvQuant 分支推送 & PR 验证：仅 linux/amd64（快速迭代，缩短集成等待）
#     - main 分支推送 / v* tag 推送（正式发布）：linux/amd64 + linux/arm64（全架构）
#     - 正式发布另打平台专属 tag（v{VERSION}[-YYYYMMDDHHMM]-linux-amd64 / -linux-arm64）
#     （平台 tag 步骤为试验期 continue-on-error，失败不阻塞主流程，跑通后收紧）

name: FinvQuantCICD

on:
  push:
    branches: [dev, main, FinvQuant, feat/integration]
    tags: ["v*"]
  pull_request:
    branches: [dev, main, FinvQuant, feat/backtest, feat/integration]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/acanx/finvquant
  # 平台列表由 docker job 的 ResolvePlatforms 步骤动态计算（见下），不再在此固定。
  # 构建策略：dev 仅 amd64，main/tag 正式发布才 amd64+arm64。

jobs:
  # ------------------------------------------------------------------
  # 1. Go 服务端构建与测试
  # ------------------------------------------------------------------
  build-server:
    name: BuildGoServer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.3"
          cache-dependency-path: go.sum

      - name: PrepareEmbeddedWebAssets
        run: |
          # 前端构建产物供 embed（无 node 环境时用最小占位，保证 SPA fallback 测试可运行）
          mkdir -p internal/webui/dist
          printf '<!doctype html><html><body><div id="app">placeholder</div></body></html>' > internal/webui/dist/index.html
          echo "{}" > internal/webui/dist/placeholder.txt || true

      - name: GoVet
        run: go vet ./...

      - name: GoBuild
        run: go build -o /tmp/finvquant ./cmd/server

      - name: GoTest
        run: go test ./... -count=1

  # ------------------------------------------------------------------
  # 2. 前端构建
  # ------------------------------------------------------------------
  build-web:
    name: BuildVueWeb
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          # 全局版本号注入前端 package.json（单一来源：项目根 VERSION）
          VERSION=$(cat ../VERSION)
          npm pkg set version="$VERSION"
          npm run build

      # 供 snapshot-binaries 复用真实前端产物（避免二次 npm ci + build）
      - name: UploadWebDist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Web/dist
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 3. 构建并推送 All-in-One 镜像到 GHCR
  # ------------------------------------------------------------------
  docker:
    name: BuildAndPushFinvQuantImage (GHCR)
    needs: [build-server, build-web]
    # feat/integration 走快照（snapshot-binaries + snapshot-release），不在此构建镜像，
    # 避免集成分支以 v{VERSION}-YYYYMMDDHHMM 规则污染 latest 与正式镜像 tag。
    if: github.event_name != 'pull_request' && github.ref != 'refs/heads/feat/integration'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: ResolveImageTags
        id: tags
        run: |
          VERSION=$(cat VERSION)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # v* tag 推送（main 发布）：latest + v{VERSION}（git tag 名）
            BASE="${{ github.ref_name }}"
          else
            # 分支推送（dev/main/FinvQuant）：latest + v{VERSION}-YYYYMMDDHHMM（Asia/Shanghai）
            TS=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)
            BASE="v${VERSION}-${TS}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "tags=${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${BASE}" >> "$GITHUB_OUTPUT"

      # 动态计算构建平台（构建速度优化）：
      #   - dev/FinvQuant 分支推送：仅 amd64（快速验证，arm64 留到正式发布）
      #   - main 分支推送 / v* tag 推送（正式发布）：amd64 + arm64 全架构
      - name: ResolvePlatforms
        id: platforms
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "plat_list=linux/amd64 linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "plat_list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: LoginToGHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: SetupQEMU
        uses: docker/setup-qemu-action@v4

      - name: SetupDockerBuildx
        uses: docker/setup-buildx-action@v4

      - name: BuildAndPushFinvQuantImage
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Deploy/Docker/Dockerfile
          push: true
          platforms: ${{ steps.platforms.outputs.platforms }}
          tags: ${{ steps.tags.outputs.tags }}
          # 构建缓存（GitHub Actions 缓存）：npm/go 依赖层与编译缓存跨构建复用，显著提速
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # 为每个平台单独打 tag（如 v0.1.0-202608051934-linux-amd64 / -linux-arm64），
      # 便于按平台拉取/区分构建产物。
      # ⚠️ 不用 docker buildx imagetools create：它在 CI 中复制 manifest 时会以匿名方式
      # 请求 GHCR token（不继承 docker login 凭据），私有包返回 403 Forbidden。
      # ⚠️🔴 踩坑教训（2026-08-05 dev push 验证失败）——crane 官方镜像
      #   （gcr.io/go-containerregistry/crane）基于 distroless，无 shell，默认 nonroot 用户：
      #   ① 挂载 ${HOME}/.docker:/root/.docker 它读不到（HOME=/home/nonroot）→ 凭据存容器内；
      #   ② auth login 与 copy 分两次 docker run，login 容器退出后凭据丢失，
      #      copy 容器匿名状态 → PUT manifest 401 UNAUTHORIZED；
      #   ③ 镜像内无 sh，--entrypoint sh 不可行。
      # ✅ 修复：不经 docker 容器，直接在 runner 上运行 crane 静态二进制（同一进程、
      #     凭据写入 runner 的 ~/.docker/config.json，login 与 copy 天然共享）。
      # ⚠️ 试验期：continue-on-error 保证平台 tag 失败不阻塞主流程（arm64 相关待验证），
      #     全流程跑通后再移除该豁免、作为必须成功项。
      - name: TagPerPlatformManifests
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="${{ steps.tags.outputs.base }}"
          # 下载 crane 静态二进制（GitHub runner 为 x86_64）
          CRANE_VER=0.21.8
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz" -o /tmp/crane.tar.gz
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          test -x /tmp/crane || { echo "crane 二进制解包失败"; exit 1; }
          # 登录 GHCR（凭据写入 runner 的 ~/.docker/config.json）
          /tmp/crane auth login ghcr.io \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}"
          # PLATFORMS 以空格分隔（plat_list 由 ResolvePlatforms 输出）；逗号会导致整串被当作单个值
          for PLAT in ${{ steps.platforms.outputs.plat_list }}; do
            SUFFIX=${PLAT//\//-}
            echo "打平台 tag: ${BASE}-${SUFFIX} (${PLAT})"
            /tmp/crane copy --platform "$PLAT" \
              "${{ env.IMAGE }}:${BASE}" \
              "${{ env.IMAGE }}:${BASE}-${SUFFIX}"
          done

  # ------------------------------------------------------------------
  # 4. PR 验证：仅构建镜像不推送
  # ------------------------------------------------------------------
  docker-pr:
    name: BuildFinvQuantImage(PRValidation)
    needs: [build-server, build-web]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: SetupDockerBuildx
        uses: docker/setup-buildx-action@v4

      - name: BuildFinvQuantImage(no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Deploy/Docker/Dockerfile
          push: false
          tags: ${{ env.IMAGE }}:pr-check

  # ------------------------------------------------------------------
  # 5. 快照元数据（feat/integration 专用）
  #    版本格式：v{VERSION}.{PPPPP}.{yymmddHHmm}
  #      PPPPP      关联 PR 编号，5 位左补零；无 PR 时 00000
  #      yymmddHHmm 构建时间戳（Asia/Shanghai），本 job 只算一次，
  #                 所有下游产物（Linux 包 / Windows 包 / tag / release）共用，
  #                 保证「同一快照包的不同产物时间戳一致」
  # ------------------------------------------------------------------
  snapshot-meta:
    name: ResolveSnapshotVersion
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/integration'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      pr: ${{ steps.meta.outputs.pr }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v5

      - name: ComputeSnapshotVersion
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(cat VERSION | tr -d '[:space:]')
          COMMIT=$(git rev-parse --short HEAD)

          # PR 编号：push 事件无 PR 上下文，按优先级三次尝试
          PR=""
          # ① 显式 PR 事件（本 job 只在 push 触发，保留以兼容 workflow_dispatch 复用）
          PR="${{ github.event.pull_request.number || '' }}"
          # ② 该分支上处于 open 的 PR
          if [[ -z "$PR" ]]; then
            PR=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --limit 1 --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          # ③ 该提交关联的 PR（push 到已有 PR 分支时生效）
          if [[ -z "$PR" ]]; then
            PR=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          fi
          # 兜底与规整：非纯数字一律 00000，其余左补零到 5 位
          if ! [[ "${PR}" =~ ^[0-9]+$ ]]; then PR=0; fi
          PR5=$(printf '%05d' "${PR}")

          # 时间戳：Asia/Shanghai，两位年
          TS=$(TZ=Asia/Shanghai date +%y%m%d%H%M)

          VERSION="v${BASE}.${PR5}.${TS}"
          echo "base_version=${BASE}" >> "$GITHUB_OUTPUT"
          echo "pr=${PR5}"          >> "$GITHUB_OUTPUT"
          echo "timestamp=${TS}"    >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "### 快照版本"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${VERSION}\` |"
            echo "| 基础版本 | \`${BASE}\` |"
            echo "| PR 编号 | \`${PR5}\` |"
            echo "| 时间戳 | \`${TS}\` |"
            echo "| 提交 | \`${COMMIT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 6. 快照二进制包（Ubuntu 26.04 / Windows 11）
  #    交叉编译 linux/amd64 与 windows/amd64，前端产物复用 build-web 的 artifact；
  #    两个包的版本号与时间戳均来自 snapshot-meta，天然一致。
  # ------------------------------------------------------------------
  snapshot-binaries:
    name: SnapshotBinary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [snapshot-meta, build-web]
    if: needs.snapshot-meta.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 平台元数据（os_label 仅用于 artifact 名；包名与后缀由 PackSnapshot.sh 统一推导）
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os_label: ubuntu
          - goos: linux
            goarch: arm64
            os_label: ubuntu
          - goos: windows
            goarch: amd64
            os_label: windows
    env:
      SNAPSHOT_VERSION: ${{ needs.snapshot-meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.3"
          cache-dependency-path: go.sum

      - name: FetchWebDist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: internal/webui/dist

      # 构建 + 打包统一调用 Deploy/Script/PackSnapshot.sh（与本地出包同一实现）
      - name: BuildAndPack
        run: |
          bash Deploy/Script/PackSnapshot.sh \
            --version "${SNAPSHOT_VERSION}" \
            --target "${{ matrix.goos }}/${{ matrix.goarch }}" \
            --commit "${{ needs.snapshot-meta.outputs.commit }}" \
            --out Dist

      - name: UploadPackage
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.os_label }}-${{ matrix.goarch }}
          path: Dist/*
          retention-days: 14
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 7. 快照发布：以快照版本为 tag 建 prerelease，附两个平台包
  # ------------------------------------------------------------------
  snapshot-release:
    name: PublishSnapshotRelease
    needs: [snapshot-meta, snapshot-binaries]
    if: needs.snapshot-meta.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: DownloadPackages
        uses: actions/download-artifact@v4
        with:
          path: Dist
          pattern: snapshot-*
          merge-multiple: true

      - name: PublishRelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ needs.snapshot-meta.outputs.version }}"
          ls -lh Dist
          cat > notes.md <<EOF
          FinvQuant 集成分支快照（\`feat/integration\`）

          | 项 | 值 |
          |---|---|
          | 快照版本 | \`${VER}\` |
          | 基础版本 | \`${{ needs.snapshot-meta.outputs.base_version }}\` |
          | 关联 PR | \`${{ needs.snapshot-meta.outputs.pr }}\` |
          | 构建时间戳 | \`${{ needs.snapshot-meta.outputs.timestamp }}\` (Asia/Shanghai) |
          | 提交 | \`${{ needs.snapshot-meta.outputs.commit }}\` |
          | 流水线 | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          ## 产物

          - Ubuntu 26.04 x86_64（linux/amd64）：\`FinvQuant_${VER}_ubuntu_amd64.tar.gz\`
          - Ubuntu 26.04 aarch64（linux/arm64）：\`FinvQuant_${VER}_ubuntu_arm64.tar.gz\`
          - Windows 11 x64（windows/amd64）：\`FinvQuant_${VER}_windows_amd64.zip\`

          两个包内 \`BUILD-INFO.txt\` 的时间戳与版本号一致，可核对同源；
          \`SHA256SUMS\` 为包内文件校验和，包本身的校验见同名 \`.sha256\` 文件。

          > 快照为集成验证用预发布版本，不保证稳定，请勿用于生产。
          EOF
          gh release create "${VER}" \
            --target "${{ github.sha }}" \
            --title "FinvQuant 快照 ${VER}" \
            --prerelease \
            --notes-file notes.md \
            Dist/*

